command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: CATALOG
    value: "serverless_stable_1acr1x_catalog"
  - name: GOLD_SCHEMA
    value: "af360_gold"
  - name: DATABRICKS_WAREHOUSE_ID
    value: "4484f27c707c5a31"
  - name: SERVING_ENDPOINT
    value: "databricks-claude-sonnet-4-6"
  - name: LAKEBASE_INSTANCE
    value: "arsenal-lakebase"
  - name: PG_SCHEMA
    value: "fan360"
  # GENIE_SPACE_ID is set after the Genie space is created (see /genie)
  - name: GENIE_SPACE_ID
    value: "01f1b9fe891814be841d05a418e8b32d"
  # Lakebase: Databricks injects a ready-to-use connection string here when the
  # `database` resource is attached to the app. The app reads/writes the fan360
  # operational tables live; if unavailable it serves the Gold snapshot + in-memory log.
  - name: DB_CONNECTION_STRING
    valueFrom: database
